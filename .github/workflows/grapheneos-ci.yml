name: GrapheneOS Build & Verification CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to execute on ubuntu (/mnt/extended)"
        required: true
        default: "preflight-and-manifest"
        type: choice
        options:
          - preflight-and-manifest
          - sync
          - sync-and-adevtool
          - adevtool
          - prebuilts
          - build
          - release-sign
          - all
      target:
        description: "GrapheneOS target device codename (stallion = Pixel 10a)"
        required: true
        default: "stallion"
        type: choice
        options:
          - stallion
          - frankel
          - blazer
          - mustang
          - rango
          - tegu
          - tokay
          - caiman
          - komodo
          - comet
          - husky
          - shiba
          - akita
          - sdk_phone64_x86_64
          - sdk_phone64_arm64
      variant:
        description: "Build variant"
        required: true
        default: "user"
        type: choice
        options:
          - user
          - userdebug
          - eng
      manifest_tag:
        description: "Pinned GrapheneOS release tag from PINNED.md"
        required: true
        default: "2026111800"
        type: string

permissions:
  contents: read

concurrency:
  group: grapheneos-ubuntu-high-mem
  cancel-in-progress: false

jobs:
  grapheneos-pipeline:
    runs-on: [self-hosted, Linux, ARM64, HIGH-MEM]
    timeout-minutes: 720
    env:
      EXTENDED_ROOT: /mnt/extended/grapheneos
      MANIFEST_TAG: ${{ inputs.manifest_tag || '2026111800' }}
      TARGET_DEVICE: ${{ inputs.target || 'stallion' }}
      BUILD_VARIANT: ${{ inputs.variant || 'user' }}
      STAGE: ${{ inputs.stage || 'preflight-and-manifest' }}
      REPO_REV: v2.74
      TOKIO_WORKER_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '1'
      GOMAXPROCS: '1'
      UV_THREADPOOL_SIZE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout yubi-OS/grapheneOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage 1 - Host Load Gate, /mnt/extended Mountpoint & Prerequisite Audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/check-host-prereqs.sh

      - name: Stage 2 - Bootstrap repo/git-lfs/Node24 & Verify GrapheneOS SSH Manifest Tag Signature
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 0 nice -n 19 ionice -c3 bash scripts/bootstrap-repo-and-verify.sh

      - name: Validate Updater Override & YubiKey AVB Signer Helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TMP_XML=$(mktemp /dev/shm/updater-config.XXXXXXXXXX.xml)
          trap 'rm -f "$TMP_XML"' EXIT
          cat > "$TMP_XML" <<'EOF'
          <resources>
              <string name="url" translatable="false">https://releases.grapheneos.org/</string>
              <string name="channel_default" translatable="false">stable</string>
          </resources>
          EOF
          bash scripts/patch-updater-url.sh "$TMP_XML" | tee evidence/helper-selftest.txt
          bash scripts/yubikey-avb-signer.sh --self-test | tee -a evidence/helper-selftest.txt

      - name: Stage 3 - Trickle-Flushed Single-Repo Paced sync on /mnt/extended (taskset -c 0, -j1)
        if: inputs.stage == 'sync' || inputs.stage == 'sync-and-adevtool' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          git config --global user.name "yubi-OS CI"
          git config --global user.email "ci@yubios.org"
          git config --global color.ui false
          git config --global pack.threads 1
          git config --global pack.windowMemory "32m"
          git config --global core.packedGitLimit "128m"
          git config --global core.packedGitWindowSize "32m"
          git config --global core.preloadIndex false
          git config --global core.fsync "objects,derived-metadata,reference"
          git config --global core.fsyncMethod "fsync"
          cd "$EXTENDED_ROOT/workspace"
          taskset -c 0 nice -n 19 ionice -c3 repo init \
            -u https://github.com/GrapheneOS/platform_manifest.git \
            -b "refs/tags/${MANIFEST_TAG}" \
            --repo-rev="${REPO_REV}" < /dev/null
          git -C .repo/manifests config gpg.ssh.allowedSignersFile "$EXTENDED_ROOT/.ssh/grapheneos_allowed_signers"
          git -C .repo/manifests verify-tag "${MANIFEST_TAG}"
          taskset -c 0 nice -n 19 ionice -c3 python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, subprocess, time, os
          tree = ET.parse(".repo/manifests/default.xml")
          projects = []
          for p in tree.getroot().findall("project"):
              path = p.get("path") or p.get("name")
              name = p.get("name")
              rev = p.get("revision")
              projects.append((path, name, rev))
          print(f"Total manifest projects: {len(projects)}", flush=True)
          todo = []
          for path, name, rev in projects:
              git_dir = os.path.join(path, ".git")
              if os.path.exists(git_dir) and rev and len(rev) == 40:
                  r = subprocess.run(["git", "-C", path, "rev-parse", "HEAD"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
                  if r.returncode == 0 and r.stdout.strip() == rev:
                      continue
              todo.append((path, name, rev))
          print(f"Already checked out at pinned revision: {len(projects) - len(todo)}/{len(projects)}; Remaining: {len(todo)}", flush=True)
          idx = 0
          while idx < len(todo):
              path, name, rev = todo[idx]
              is_heavy = path.startswith("prebuilts/") or path.startswith("external/vanadium") or path.startswith("external/chromium") or "-kernels/" in path or "kernel/prebuilts" in path
              if is_heavy:
                  batch_paths = [path]
                  idx += 1
              else:
                  batch_paths = []
                  while idx < len(todo) and len(batch_paths) < 10:
                      p_i = todo[idx][0]
                      if p_i.startswith("prebuilts/") or p_i.startswith("external/vanadium") or p_i.startswith("external/chromium") or "-kernels/" in p_i or "kernel/prebuilts" in p_i:
                          break
                      batch_paths.append(p_i)
                      idx += 1
              print(f"[{idx}/{len(todo)}] Syncing ({len(batch_paths)}): {batch_paths[0]} ...", flush=True)
              base_cmd = ["taskset", "-c", "0", "nice", "-n", "19", "ionice", "-c3", "repo", "sync", "-c", "--no-clone-bundle", "--no-tags", "--force-sync", "--force-broken", "-j1", "--jobs-network=1", "--jobs-checkout=1"]
              subprocess.run(base_cmd + ["--network-only"] + batch_paths, check=True)
              subprocess.run(["sync"])
              time.sleep(3 if not is_heavy else 8)
              subprocess.run(base_cmd + ["--local-only"] + batch_paths, check=True)
              subprocess.run(["sync"])
              time.sleep(3 if not is_heavy else 10)
          print("All 1,057 projects synced and checked out cleanly.", flush=True)
          PYEOF
          { date -u +%FT%TZ; df -h /mnt/extended; du -sh "$EXTENDED_ROOT/workspace"; } | tee "$GITHUB_WORKSPACE/evidence/repo-sync-summary.txt"

      - name: Configure Debian Bookworm x86_64 glibc 2.36 Sysroot & Native ARM64 Build-Tools
        if: inputs.stage == 'adevtool' || inputs.stage == 'sync-and-adevtool' || inputs.stage == 'build' || inputs.stage == 'release-sign' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          QEMU_SYSROOT="$EXTENDED_ROOT/x86_64-sysroot"
          DEB_CACHE="$EXTENDED_ROOT/bin/debs-amd64"
          mkdir -p "$DEB_CACHE"
          if [ ! -f "$QEMU_SYSROOT/.bookworm-2.36-ready" ]; then
            rm -rf "$QEMU_SYSROOT"
            mkdir -p "$QEMU_SYSROOT"
            fetch_and_unpack() {
              local url="$1" fn="$2" sha256="$3" sha512="$4"
              if [ ! -f "$DEB_CACHE/$fn" ]; then
                curl -fsSL "$url" -o "$DEB_CACHE/$fn"
              fi
              echo "$sha256  $DEB_CACHE/$fn" | sha256sum --check --strict
              echo "$sha512  $DEB_CACHE/$fn" | sha512sum --check --strict
              dpkg-deb -x "$DEB_CACHE/$fn" "$QEMU_SYSROOT"
            }
            fetch_and_unpack "https://deb.debian.org/debian/pool/main/g/glibc/libc6_2.36-9+deb12u14_amd64.deb" "libc6.deb" "ba4f88f73dbc3ae9055f3c20f4523bfdbaf1ad13ff95e258924f77d20b4fbedf" "2672eff8c51312d24a026043d4b6322de23e37f807dc3925c588474e413de2b7194926ac84ac075aa70dd8b6fbe7cfff3d015995d0a3c200fb8b191f59ac4595"
            fetch_and_unpack "https://deb.debian.org/debian/pool/main/g/gcc-12/libgcc-s1_12.2.0-14+deb12u1_amd64.deb" "libgcc-s1.deb" "3016e62cb4b7cd8038822870601f5ed131befe942774d0f745622cc77d8a88f7" "5fb1aac6240ac55280bb90393746b17498ffdcbb24e49afa01052bd9468bed594bc5c43938f2af594b48d2eab9e2dd07ffd3d5f276be5b16a00116479ff6cb68"
            fetch_and_unpack "https://deb.debian.org/debian/pool/main/g/gcc-12/libstdc++6_12.2.0-14+deb12u1_amd64.deb" "libstdcpp6.deb" "5cd3171216d4ab0fc911cfe9c35509bf2dd8f47761c43b7f6a4296701551a24d" "43c0d1cb52b29c12b7d5ce7629b2690b84e60aa98e8fe05481eeca857781e341c387b7067916ac770ffc8879fec86810c6a7a0e31011db3db8112f1fe9b01753"
            fetch_and_unpack "https://deb.debian.org/debian/pool/main/z/zlib/zlib1g_1.2.13.dfsg-1_amd64.deb" "zlib1g.deb" "d7dd1d1411fedf27f5e27650a6eff20ef294077b568f4c8c5e51466dc7c08ce4" "f3ef7353438d4c77687ad58dd9da7bf78f5e95cb9ddb0cb691e0e9364d22d27badb852dab4e2452f4f705fd6b0d5b34fd1fd18801242476de1bf136d2681f0d9"
            mkdir -p "$QEMU_SYSROOT/lib64"
            ln -sfn ../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 "$QEMU_SYSROOT/lib64/ld-linux-x86-64.so.2"
            touch "$QEMU_SYSROOT/.bookworm-2.36-ready"
          fi
          # Overlay native linux-arm64 build-tools onto linux-x86 and install the x86_64 uname shim into prebuilts/build-tools/path/linux-x86/uname
          BT_DIR="$EXTENDED_ROOT/workspace/prebuilts/build-tools"
          if [ -d "$BT_DIR/linux-arm64/bin" ]; then
            cp -af "$BT_DIR/linux-arm64/bin/"* "$BT_DIR/linux-x86/bin/"
            cp -af "$BT_DIR/linux-arm64/lib64/"* "$BT_DIR/linux-x86/lib64/" 2>/dev/null || true
            rm -f "$BT_DIR/path/linux-x86/uname"
            cp -f "$EXTENDED_ROOT/x86_64-shim/uname" "$BT_DIR/path/linux-x86/uname"
            chmod 0755 "$BT_DIR/path/linux-x86/uname"
            "$BT_DIR/path/linux-x86/uname" -sm | grep -q "Linux x86_64"
          fi
          export QEMU_LD_PREFIX="$QEMU_SYSROOT"
          "$EXTENDED_ROOT/workspace/prebuilts/build-tools/path/linux-x86/sha256sum" --version | tee "$GITHUB_WORKSPACE/evidence/qemu-x86_64-sysroot-test.txt"
          "$EXTENDED_ROOT/workspace/prebuilts/go/linux-x86/bin/go" version | tee -a "$GITHUB_WORKSPACE/evidence/qemu-x86_64-sysroot-test.txt"

      - name: Stage 4 - RAM-Staged (/dev/shm) Throttled adevtool Vendor Extraction (Pixel 10a stallion)
        if: (inputs.stage == 'adevtool' || inputs.stage == 'sync-and-adevtool' || inputs.stage == 'all') && inputs.target != 'sdk_phone64_x86_64' && inputs.target != 'sdk_phone64_arm64'
        shell: bash
        run: |
          set -euo pipefail
          export QEMU_LD_PREFIX="$EXTENDED_ROOT/x86_64-sysroot"
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin/node-v24.22.3/bin:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export YARN_CACHE_FOLDER="$EXTENDED_ROOT/vendor_cache/yarn"
          cat > /dev/shm/one-cpu.cjs <<'EOF'
          const os = require('os');
          const origCpus = os.cpus.bind(os);
          os.cpus = () => origCpus().slice(0, 1);
          EOF
          export NODE_OPTIONS="--require /dev/shm/one-cpu.cjs --max-old-space-size=8192"
          rm -rf /dev/shm/adevtool-tmp /dev/shm/adevtool-unpacked /dev/shm/out_adevtool_deps /dev/shm/google_devices_ram
          mkdir -p /dev/shm/adevtool-tmp /dev/shm/adevtool-unpacked /dev/shm/out_adevtool_deps /dev/shm/google_devices_ram "$EXTENDED_ROOT/vendor_cache"
          export TMPDIR="/dev/shm/adevtool-tmp"
          trap 'rm -rf /dev/shm/adevtool-tmp /dev/shm/adevtool-unpacked /dev/shm/out_adevtool_deps /dev/shm/google_devices_ram /dev/shm/one-cpu.cjs' EXIT
          cd "$EXTENDED_ROOT/workspace"
          mkdir -p vendor/adevtool/dl
          for dir_cand in "vendor/adevtool/dl" "$EXTENDED_ROOT/vendor_cache"; do
            STALLION_TMP="$dir_cand/stallion-cp4a.261105.040.a1-factory-45cdadb1.zip.tmp"
            STALLION_ZIP="vendor/adevtool/dl/stallion-cp4a.261105.040.a1-factory-45cdadb1.zip"
            if [ -f "$STALLION_TMP" ] && [ ! -f "$STALLION_ZIP" ]; then
              echo "Verifying already-downloaded $STALLION_TMP against pinned SHA-256..."
              if echo "45cdadb1e34b4dd4462069a36c131ebe3a05d9d4be5f567f9cd61b7c69d5dbe8  $STALLION_TMP" | /usr/bin/sha256sum -c -; then
                mv -f "$STALLION_TMP" "$STALLION_ZIP"
                echo "Reused verified 4.2 GiB stallion factory image at $STALLION_ZIP"
              fi
            fi
          done
          rm -rf vendor/adevtool/dl/unpacked
          ln -sfn /dev/shm/adevtool-unpacked vendor/adevtool/dl/unpacked
          ADEVTOOL_REV=$(git -C vendor/adevtool rev-parse HEAD)
          if [ ! -f "$EXTENDED_ROOT/out_adevtool_deps_cache/adevtool_revision" ] || [ "$(cat "$EXTENDED_ROOT/out_adevtool_deps_cache/adevtool_revision" 2>/dev/null)" != "$ADEVTOOL_REV" ]; then
            echo "Building adevtool host dependencies in /dev/shm/out_adevtool_deps (RAM, zero mmcblk0 I/O)..."
            rm -rf out_adevtool_deps
            ln -sfn /dev/shm/out_adevtool_deps out_adevtool_deps
            taskset -c 0 nice -n 19 ionice -c3 bash -c '
              set -euo pipefail
              export ANDROID_QUIET_BUILD=true
              export OUT_DIR=out_adevtool_deps
              source build/envsetup.sh
              lunch sdk_phone64_x86_64-cur-userdebug
              m -j1 aapt2 apksigner aprotoc arsclib debugfs dispol fsck.erofs lpdump lpunpack lz4 ota_extractor simg2img sqlite3 toybox
            '
            echo -n "$ADEVTOOL_REV" > /dev/shm/out_adevtool_deps/adevtool_revision
            mkdir -p "$EXTENDED_ROOT/out_adevtool_deps_cache/host"
            taskset -c 0 nice -n 19 ionice -c3 rsync -a --bwlimit=10000 /dev/shm/out_adevtool_deps/host/linux-x86 "$EXTENDED_ROOT/out_adevtool_deps_cache/host/"
            cp -f /dev/shm/out_adevtool_deps/adevtool_revision "$EXTENDED_ROOT/out_adevtool_deps_cache/adevtool_revision"
            rm -rf /dev/shm/out_adevtool_deps/*
          fi
          rm -rf out_adevtool_deps
          ln -sfn "$EXTENDED_ROOT/out_adevtool_deps_cache" out_adevtool_deps
          export ADEVTOOL_SKIP_DEP_BUILD="1"
          taskset -c 0 nice -n 19 ionice -c3 yarn --cwd vendor/adevtool install --frozen-lockfile
          sync && sleep 5
          rm -rf vendor/google_devices
          ln -sfn /dev/shm/google_devices_ram vendor/google_devices
          taskset -c 0 nice -n 19 ionice -c3 vendor/adevtool/bin/run generate-all -d "${TARGET_DEVICE}"
          rm -f vendor/google_devices vendor/adevtool/dl/unpacked
          rm -rf /dev/shm/adevtool-unpacked
          mkdir -p vendor/google_devices
          echo "Trickle-syncing extracted vendor/google_devices/${TARGET_DEVICE} from RAM (/dev/shm) to /mnt/extended at 10 MB/s..."
          taskset -c 0 nice -n 19 ionice -c3 rsync -a --bwlimit=10000 /dev/shm/google_devices_ram/ vendor/google_devices/
          sync
          { date -u +%FT%TZ; ls -la "vendor/google_devices/${TARGET_DEVICE}"; du -sh "vendor/google_devices/${TARGET_DEVICE}"; df -h /mnt/extended; } | tee "$GITHUB_WORKSPACE/evidence/adevtool-${TARGET_DEVICE}.txt"

      - name: Stage 5 - Throttled OS Build on /mnt/extended
        if: inputs.stage == 'build' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          export QEMU_LD_PREFIX="$EXTENDED_ROOT/x86_64-sysroot"
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin/node-v24.22.3/bin:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export CCACHE_DIR="$EXTENDED_ROOT/ccache"
          export BUILD_NUMBER="${MANIFEST_TAG}"
          export BUILD_DATETIME="1795038729"
          cd "$EXTENDED_ROOT/workspace"
          bash "$GITHUB_WORKSPACE/scripts/patch-updater-url.sh" "$EXTENDED_ROOT/workspace/packages/apps/Updater/res/values/config.xml"
          source build/envsetup.sh
          lunch "${TARGET_DEVICE}-cur-${BUILD_VARIANT}"
          if [ "${TARGET_DEVICE}" = "sdk_phone64_x86_64" ] || [ "${TARGET_DEVICE}" = "sdk_phone64_arm64" ]; then
            taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2
          else
            export OFFICIAL_BUILD=true
            case "${TARGET_DEVICE}" in
              oriole|raven|bluejay)
                taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2 vendorbootimage target-files-package otatools-package
                ;;
              *)
                taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2 vendorbootimage vendorkernelbootimage target-files-package otatools-package
                ;;
            esac
          fi

      - name: Stage 6 - Memory-Safe Release Signing (/dev/shm tmpfs)
        if: inputs.stage == 'release-sign' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wc -l < /proc/swaps)" -gt 1 ]; then
            echo "ERROR: Active swap detected in /proc/swaps. Disable swap before decrypting release signing keys into /dev/shm!" >&2
            exit 1
          fi
          export QEMU_LD_PREFIX="$EXTENDED_ROOT/x86_64-sysroot"
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export BUILD_NUMBER="${MANIFEST_TAG}"
          export BUILD_DATETIME="1795038729"
          cd "$EXTENDED_ROOT/workspace"
          source build/envsetup.sh
          lunch "${TARGET_DEVICE}-cur-user"
          taskset -c 0 nice -n 19 ionice -c3 script/finalize.sh
          taskset -c 0 nice -n 19 ionice -c3 script/generate-release.sh "${TARGET_DEVICE}" "${BUILD_NUMBER}"

      - name: Upload CI Verification Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grapheneos-ci-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
