name: GrapheneOS Build & Verification CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to execute on ubuntu (/mnt/extended)"
        required: true
        default: "preflight-and-manifest"
        type: choice
        options:
          - preflight-and-manifest
          - sync
          - sync-and-adevtool
          - adevtool
          - prebuilts
          - build
          - release-sign
          - all
      target:
        description: "GrapheneOS target device codename (stallion = Pixel 10a)"
        required: true
        default: "stallion"
        type: choice
        options:
          - stallion
          - frankel
          - blazer
          - mustang
          - rango
          - tegu
          - tokay
          - caiman
          - komodo
          - comet
          - husky
          - shiba
          - akita
          - sdk_phone64_x86_64
          - sdk_phone64_arm64
      variant:
        description: "Build variant"
        required: true
        default: "user"
        type: choice
        options:
          - user
          - userdebug
          - eng
      manifest_tag:
        description: "Pinned GrapheneOS release tag from PINNED.md"
        required: true
        default: "2026111800"
        type: string

permissions:
  contents: read

concurrency:
  group: grapheneos-ubuntu-high-mem
  cancel-in-progress: false

jobs:
  grapheneos-pipeline:
    runs-on: [self-hosted, Linux, ARM64, HIGH-MEM]
    timeout-minutes: 720
    env:
      EXTENDED_ROOT: /mnt/extended/grapheneos
      MANIFEST_TAG: ${{ inputs.manifest_tag || '2026111800' }}
      TARGET_DEVICE: ${{ inputs.target || 'stallion' }}
      BUILD_VARIANT: ${{ inputs.variant || 'user' }}
      STAGE: ${{ inputs.stage || 'preflight-and-manifest' }}
      REPO_REV: v2.74
      TOKIO_WORKER_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '1'
      GOMAXPROCS: '1'
      UV_THREADPOOL_SIZE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout yubi-OS/grapheneOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage 1 - Host Load Gate, /mnt/extended Mountpoint & Prerequisite Audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/check-host-prereqs.sh

      - name: Stage 2 - Bootstrap repo/git-lfs/Node24 & Verify GrapheneOS SSH Manifest Tag Signature
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 0 nice -n 19 ionice -c3 bash scripts/bootstrap-repo-and-verify.sh

      - name: Validate Updater Override & YubiKey AVB Signer Helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TMP_XML=$(mktemp /dev/shm/updater-config.XXXXXXXXXX.xml)
          trap 'rm -f "$TMP_XML"' EXIT
          cat > "$TMP_XML" <<'EOF'
          <resources>
              <string name="url" translatable="false">https://releases.grapheneos.org/</string>
              <string name="channel_default" translatable="false">stable</string>
          </resources>
          EOF
          bash scripts/patch-updater-url.sh "$TMP_XML" | tee evidence/helper-selftest.txt
          bash scripts/yubikey-avb-signer.sh --self-test | tee -a evidence/helper-selftest.txt

      - name: Stage 3 - Batch-Paced Single-Core Throttled repo sync on /mnt/extended (taskset -c 0, -j1)
        if: inputs.stage == 'sync' || inputs.stage == 'sync-and-adevtool' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          git config --global user.name "yubi-OS CI"
          git config --global user.email "ci@yubios.org"
          git config --global color.ui false
          git config --global pack.threads 1
          git config --global pack.windowMemory "64m"
          git config --global core.preloadIndex false
          if [ -d "$EXTENDED_ROOT/workspace/.repo" ]; then
            echo "Scanning .repo for stale locks or crash-corrupted refs..."
            find "$EXTENDED_ROOT/workspace/.repo" \( -name "*.lock" -o -name "tmp_pack_*" -o -name "tmp_obj_*" \) -delete 2>/dev/null || true
            taskset -c 0 nice -n 19 ionice -c3 python3 - "$EXTENDED_ROOT/workspace/.repo" <<'PYEOF'
          import os, subprocess, shutil, sys
          repo_dir = sys.argv[1]
          fixed = 0
          for root_sub in ["projects", "project-objects"]:
              base = os.path.join(repo_dir, root_sub)
              if not os.path.isdir(base):
                  continue
              for dirpath, dirnames, filenames in os.walk(base):
                  if dirpath.endswith(".git"):
                      dirnames[:] = []
                      obj_dir = os.path.join(dirpath, "objects")
                      if os.path.isdir(obj_dir):
                          for o_root, _, o_files in os.walk(obj_dir):
                              for f in o_files:
                                  fp = os.path.join(o_root, f)
                                  try:
                                      if os.path.getsize(fp) == 0:
                                          os.unlink(fp)
                                          fixed += 1
                                  except OSError:
                                      pass
                      r = subprocess.run(["git", "--git-dir", dirpath, "for-each-ref"], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                      if r.returncode != 0 or "bad object" in r.stderr or "corrupt" in r.stderr:
                          print(f"Repairing crash-corrupted git dir: {dirpath} -> {r.stderr.strip()}")
                          for sub_ref in [("refs", "remotes", "m"), ("refs", "tags")]:
                              p = os.path.join(dirpath, *sub_ref)
                              if os.path.exists(p):
                                  shutil.rmtree(p, ignore_errors=True)
                          packed = os.path.join(dirpath, "packed-refs")
                          if os.path.exists(packed):
                              os.unlink(packed)
                          r2 = subprocess.run(["git", "--git-dir", dirpath, "for-each-ref"], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                          if r2.returncode != 0:
                              print(f"Removing unrecoverable git dir for clean re-fetch: {dirpath}")
                              shutil.rmtree(dirpath, ignore_errors=True)
                          fixed += 1
          print(f"Crash-recovery scan complete (repaired/cleaned {fixed} git dirs).")
          PYEOF
          fi
          cd "$EXTENDED_ROOT/workspace"
          taskset -c 0 nice -n 19 ionice -c3 repo init \
            -u https://github.com/GrapheneOS/platform_manifest.git \
            -b "refs/tags/${MANIFEST_TAG}" \
            --repo-rev="${REPO_REV}" < /dev/null
          if [ -x "$EXTENDED_ROOT/workspace/.repo/repo/repo" ]; then
            cp -f "$EXTENDED_ROOT/workspace/.repo/repo/repo" "$EXTENDED_ROOT/bin/repo"
            chmod 0755 "$EXTENDED_ROOT/bin/repo"
          fi
          git -C .repo/manifests config gpg.ssh.allowedSignersFile "$EXTENDED_ROOT/.ssh/grapheneos_allowed_signers"
          git -C .repo/manifests verify-tag "${MANIFEST_TAG}"
          taskset -c 0 nice -n 19 ionice -c3 python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, subprocess, time, os, sys
          tree = ET.parse(".repo/manifests/default.xml")
          projects = []
          for p in tree.getroot().findall("project"):
              path = p.get("path") or p.get("name")
              rev = p.get("revision")
              projects.append((path, rev))
          print(f"Total manifest projects: {len(projects)}")
          todo = []
          for path, rev in projects:
              git_dir = os.path.join(path, ".git")
              if os.path.exists(git_dir) and rev and len(rev) == 40:
                  r = subprocess.run(["git", "-C", path, "rev-parse", "HEAD"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
                  if r.returncode == 0 and r.stdout.strip() == rev:
                      continue
              todo.append(path)
          print(f"Already at pinned revision: {len(projects) - len(todo)}/{len(projects)}; Remaining to sync: {len(todo)}")
          batch_size = 35
          for i in range(0, len(todo), batch_size):
              batch = todo[i:i+batch_size]
              print(f"=== Syncing batch {i//batch_size + 1}/{(len(todo) + batch_size - 1)//batch_size} ({len(batch)} repos, index {i}..{i+len(batch)-1}) ===", flush=True)
              cmd = ["taskset", "-c", "0", "nice", "-n", "19", "ionice", "-c3", "repo", "sync", "-c", "--no-clone-bundle", "--no-tags", "--force-sync", "--force-broken", "-j1", "--jobs-network=1", "--jobs-checkout=1"] + batch
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"Retrying batch {i//batch_size + 1} once after transient error...", flush=True)
                  subprocess.run(cmd, check=True)
              subprocess.run(["sync"])
              time.sleep(10)
          print("All batches synced; running final verification pass...", flush=True)
          PYEOF
          { date -u +%FT%TZ; df -h /mnt/extended; du -sh "$EXTENDED_ROOT/workspace"; } | tee "$GITHUB_WORKSPACE/evidence/repo-sync-summary.txt"

      - name: Stage 4 - adevtool Vendor Extraction for Target Device (Pixel 10a stallion)
        if: (inputs.stage == 'adevtool' || inputs.stage == 'sync-and-adevtool' || inputs.stage == 'all') && inputs.target != 'sdk_phone64_x86_64' && inputs.target != 'sdk_phone64_arm64'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin/node-v24.22.3/bin:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export YARN_CACHE_FOLDER="$EXTENDED_ROOT/vendor_cache/yarn"
          export IMAGE_DOWNLOAD_DIR="$EXTENDED_ROOT/vendor_cache"
          mkdir -p "$HOME/.adevtool-cache"
          ln -sfn "$EXTENDED_ROOT/vendor_cache" "$HOME/.adevtool-cache/images"
          cd "$EXTENDED_ROOT/workspace"
          taskset -c 0 nice -n 19 ionice -c3 yarn --cwd vendor/adevtool install --frozen-lockfile
          taskset -c 0 nice -n 19 ionice -c3 vendor/adevtool/bin/run generate-all -d "${TARGET_DEVICE}"
          sync
          { date -u +%FT%TZ; ls -la "vendor/google_devices/${TARGET_DEVICE}"; df -h /mnt/extended; } | tee "$GITHUB_WORKSPACE/evidence/adevtool-${TARGET_DEVICE}.txt"

      - name: Stage 5 - Throttled OS Build on /mnt/extended
        if: inputs.stage == 'build' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin/node-v24.22.3/bin:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export CCACHE_DIR="$EXTENDED_ROOT/ccache"
          export BUILD_NUMBER="${MANIFEST_TAG}"
          export BUILD_DATETIME="1795038729"
          cd "$EXTENDED_ROOT/workspace"
          bash "$GITHUB_WORKSPACE/scripts/patch-updater-url.sh" "$EXTENDED_ROOT/workspace/packages/apps/Updater/res/values/config.xml"
          source build/envsetup.sh
          lunch "${TARGET_DEVICE}-cur-${BUILD_VARIANT}"
          if [ "${TARGET_DEVICE}" = "sdk_phone64_x86_64" ] || [ "${TARGET_DEVICE}" = "sdk_phone64_arm64" ]; then
            taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2
          else
            export OFFICIAL_BUILD=true
            case "${TARGET_DEVICE}" in
              oriole|raven|bluejay)
                taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2 vendorbootimage target-files-package otatools-package
                ;;
              *)
                taskset -c 0 nice -n 19 ionice -c3 m -j1 -l2 vendorbootimage vendorkernelbootimage target-files-package otatools-package
                ;;
            esac
          fi

      - name: Stage 6 - Memory-Safe Release Signing (/dev/shm tmpfs)
        if: inputs.stage == 'release-sign' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wc -l < /proc/swaps)" -gt 1 ]; then
            echo "ERROR: Active swap detected in /proc/swaps. Disable swap before decrypting release signing keys into /dev/shm!" >&2
            exit 1
          fi
          export PATH="$EXTENDED_ROOT/x86_64-shim:$EXTENDED_ROOT/bin:$PATH:/sbin:/usr/sbin:/usr/local/sbin"
          export BUILD_NUMBER="${MANIFEST_TAG}"
          export BUILD_DATETIME="1795038729"
          cd "$EXTENDED_ROOT/workspace"
          source build/envsetup.sh
          lunch "${TARGET_DEVICE}-cur-user"
          taskset -c 0 nice -n 19 ionice -c3 script/finalize.sh
          taskset -c 0 nice -n 19 ionice -c3 script/generate-release.sh "${TARGET_DEVICE}" "${BUILD_NUMBER}"

      - name: Upload CI Verification Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grapheneos-ci-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
